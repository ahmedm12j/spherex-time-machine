# Deploy the Streamlit app to Streamlit Community Cloud on every push to `main`.
# This is a convenience workflow: the URL is already live at
# https://spherex-time-machine.streamlit.app — this just keeps it in sync with `main`.
#
# Required secret: STREAMLIT_CLOUD_PAT (a GitHub PAT with repo scope, owned by the
# repo owner). The workflow does NOT store or log it. If the secret is absent, the
# workflow is a no-op (the live URL keeps running the last successful deploy).

name: Deploy to Streamlit Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.STREAMLIT_CLOUD_PAT != '' || secrets.STREAMLIT_CLOUD_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Push the head commit to the Streamlit Cloud deploy branch
        env:
          GH_TOKEN: ${{ secrets.STREAMLIT_CLOUD_PAT }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: streamlit-cloud-deploy
        run: |
          set -euo pipefail
          if ! gh api "repos/$GH_REPO" >/dev/null 2>&1; then
            echo "gh token cannot read the repo — skipping deploy (URL keeps old code)"
            exit 0
          fi
          # Streamlit Cloud watches this branch for the app root.
          git clone --depth 1 --branch "$GH_BRANCH" "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" deploy 2>/dev/null || {
            gh api "repos/$GH_REPO/git/refs" -X POST -f "ref=refs/heads/$GH_BRANCH" \
              -f "sha=$(git rev-parse HEAD)" >/dev/null
          }
          cd deploy
          git checkout "$GH_BRANCH"
          git reset --hard "origin/main" || git reset --hard HEAD
          git clean -fd
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" HEAD:"$GH_BRANCH"
          echo "pushed to $GH_BRANCH — Streamlit Cloud will rebuild on the next commit"
