# Optional mirror: push the head commit to the Streamlit Cloud deploy branch.
# The live app is already deployed at https://spherex-time-machine.streamlit.app and is
# connected to `main` in Streamlit Cloud. This workflow is not required for a normal deploy.
#
# Required secret: STREAMLIT_CLOUD_PAT (a GitHub PAT with repo scope, owned by the repo
# owner). If the secret is absent the job is skipped. The workflow does not store or log it.

name: Deploy to Streamlit Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.STREAMLIT_CLOUD_PAT != '' || secrets.STREAMLIT_CLOUD_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Push the head commit to the Streamlit Cloud deploy branch
        env:
          GH_TOKEN: ${{ secrets.STREAMLIT_CLOUD_PAT }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: streamlit-cloud-deploy
        run: |
          set -euo pipefail
          if ! gh api "repos/$GH_REPO" >/dev/null 2>&1; then
            echo "gh token cannot read the repo — skipping deploy (the live app keeps its current build)"
            exit 0
          fi
          git clone --depth 1 --branch "$GH_BRANCH" "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" deploy 2>/dev/null || {
            gh api "repos/$GH_REPO/git/refs" -X POST -f "ref=refs/heads/$GH_BRANCH" \
              -f "sha=$(git rev-parse HEAD)" >/dev/null
          }
          cd deploy
          git checkout "$GH_BRANCH"
          git reset --hard "origin/main" || git reset --hard HEAD
          git clean -fd
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" HEAD:"$GH_BRANCH"
          echo "pushed to $GH_BRANCH — Streamlit Cloud will rebuild from that branch"
